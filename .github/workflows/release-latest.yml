name: Release latest APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-latest
  cancel-in-progress: true

jobs:
  release:
    name: Publish latest release
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout source code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd #v6.0.2

      - name: Setup project and build environment
        uses: ./.github/actions/common-setup

      # Release builds fallback to debug key if release key is absent,
      # but AGP requires the debug keystore to exist first.
      - name: Create debug keystore fallback
        run: |
          echo "ANDROID_USER_HOME=$HOME/.android" >> "$GITHUB_ENV"
          test -f ~/.android/debug.keystore && exit 0
          mkdir -p ~/.android
          keytool -genkeypair -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey \
            -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"

      - name: Assemble FOSS release and debug APKs
        run: ./gradlew :app:assembleFossRelease :app:assembleFossDebug

      - name: Prepare APKs
        id: apk
        run: |
          rel_src="$(find app/build/outputs/apk/foss/release -name '*.apk' | head -n 1)"
          dbg_src="$(find app/build/outputs/apk/foss/debug -name '*.apk' | head -n 1)"
          test -n "$rel_src"
          cp "$rel_src" sdmaid-se-foss-release.apk
          if [ -n "$dbg_src" ]; then
            cp "$dbg_src" sdmaid-se-foss-debug.apk
          fi

      - name: Publish GitHub prerelease (tag latest)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Mutable rolling tag: drop the previous release+tag, then recreate on this commit.
          gh release delete latest --repo "${{ github.repository }}" --yes --cleanup-tag 2>/dev/null || true
          
          assets=()
          [ -f "sdmaid-se-foss-release.apk" ] && assets+=("sdmaid-se-foss-release.apk")
          [ -f "sdmaid-se-foss-debug.apk" ] && assets+=("sdmaid-se-foss-debug.apk")
          
          gh release create latest \
            --repo "${{ github.repository }}" \
            --prerelease \
            --latest=false \
            --target "${{ github.sha }}" \
            --title "Latest build" \
            --notes "Unlocked FOSS APKs from \`${{ github.sha }}\` on \`${{ github.ref_name }}\` (run ${{ github.run_number }}). Includes optimized Release build (\`sdmaid-se-foss-release.apk\`) and Debug build." \
            "${assets[@]}"
